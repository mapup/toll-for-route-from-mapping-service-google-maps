name: Syft SBOM Generation

# PORTABLE TEMPLATE — copy into <your-repo>/.github/workflows/syft-sbom.yml
# as-is. NEW workflow (no counterpart in mapup-security-team's own
# .github/workflows/ yet): the 2026-08 coverage audit found Syft at zero
# coverage org-wide — this template closes that gap.
#
# Syft (anchore/sbom-action) generates a dependency-focused CycloneDX SBOM
# — complementary to the Trivy SBOM from universal-dependency-track.yml,
# which runs in license mode. Uploaded to Dependency-Track under its own
# project version ('main-syft') so the two SBOMs never overwrite each
# other, and always archived as a build artifact.
#
# Optional secrets (steps skip gracefully when unset):
#   DEPENDENCYTRACK_API_KEY - SBOM upload to Dependency-Track
#   GCHAT_WEBHOOK_URL       - failure alerts

on:
  # No branch filter: repos differ in default-branch names. Pushes are
  # gated to the repo's actual default branch by the job-level `if` below.
  push:
  schedule:
    - cron: '30 9 * * *'   # daily, offset from the Trivy SBOM run at 9:00
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "Manual Syft SBOM run"

jobs:
  syft-sbom:
    name: Generate SBOM with Syft
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: syft-sbom.json
          upload-artifact: false

      - name: Check SBOM and Dependency-Track key
        id: sbom_check
        env:
          DT_API_KEY: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
        run: |
          count=$(jq '.components | length' syft-sbom.json 2>/dev/null || echo 0)
          echo "SBOM component count: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ -n "$DT_API_KEY" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "DEPENDENCYTRACK_API_KEY not set — Dependency-Track upload will be skipped."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload BOM to Dependency-Track
        if: ${{ always() && steps.sbom_check.outputs.upload == 'true' && steps.sbom_check.outputs.count != '0' && steps.sbom_check.outputs.count != '' }}
        uses: DependencyTrack/gh-upload-sbom@v3
        with:
          serverhostname: '44.194.0.211'
          port: '8091'
          protocol: 'http'
          apikey: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          projectname: ${{ github.event.repository.name }}
          projectversion: 'main-syft'
          bomfilename: 'syft-sbom.json'
          autocreate: 'true'

      - name: Archive Syft SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syft-sbom
          path: syft-sbom.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Send Google Chat Alert on Failure
        if: failure()
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
        run: |
          if [ -z "$GCHAT_WEBHOOK_URL" ]; then
            echo "GCHAT_WEBHOOK_URL not set — skipping alert."
            exit 0
          fi
          curl -sS -X POST "$GCHAT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"text": "⚠️ [Medium] Syft: SBOM generation failed in ${{ github.repository }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
