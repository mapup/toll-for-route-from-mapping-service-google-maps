name: SonarQube Scan

on:
  schedule:
    - cron: '15 3,15 * * *'
  workflow_dispatch:
    inputs:
    branch:
      description: 'Branch to scan'
      required: false
      default: 'main'
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual SonarQube scan'

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  SONAR_HOST_URL: https://sonarqube.mapup.ai

jobs:
  sonarqube-scan:
    name: SonarQube - ${{ matrix.projectKey }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - projectDir: "javascript"
            projectKey: "tolltally-toll-for-route-google-maps-javascript"
            projectStack: "node"
            exclusions: "**/node_modules/**"
            extraArgs: ""
          - projectDir: "python"
            projectKey: "tolltally-toll-for-route-google-maps-python"
            projectStack: "python"
            exclusions: "**/node_modules/**"
            extraArgs: " -Dsonar.python.coverage.reportPaths=**/coverage.xml"

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch || 'main' }}
      - name: Set up Node.js
        if: ${{ matrix.projectStack == 'node' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Log manual run reason
        if: github.event_name == 'workflow_dispatch'
        env:
          RUN_REASON: ${{ github.event.inputs.reason }}
        run: echo "Manual trigger - $RUN_REASON"

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ matrix.projectDir }}
          args: >
            -Dsonar.projectKey=${{ matrix.projectKey }}
            -Dsonar.sources=.
            -Dsonar.exclusions=${{ matrix.exclusions }}
            ${{ matrix.extraArgs }}
      - name: Update project sheet tab
        continue-on-error: true
        run: |
          sleep 120
          RESPONSE=$(curl -s -L \
            "${{ secrets.APPS_SCRIPT_WEB_APP_URL }}?project=${{ matrix.projectKey }}")
          echo "Sheet update response: $RESPONSE"
          if [ "$RESPONSE" = "ok" ]; then
            echo "Sheet updated successfully"
          else
            echo "Sheet update may have failed: $RESPONSE"
          fi
