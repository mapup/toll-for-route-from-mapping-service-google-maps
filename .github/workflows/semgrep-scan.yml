# Semgrep scan -> Google Sheet dashboard (via Apps Script webhook)
#
# Copy this file to .github/workflows/semgrep-scan.yml in each repo (on the
# default branch — the schedule trigger only fires from there).
#
# Required secrets (set once at the ORG level, access: all repositories,
# so every repo inherits them — or per repo if org secrets can't be used):
#   SEMGREP_SHEET_URL   - the Apps Script web app /exec URL (see Code.gs)
#   SEMGREP_SHEET_TOKEN - the token printed by the script's setup() function
#
# Repo ownership lives in the sheet's "Owners" tab — edit it there.

name: Semgrep Scan

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to scan (leave empty = repo's default branch)"
        required: false
        default: ""
  schedule:
    - cron: "0 */3 * * *" # every 3 hours (UTC); use "0 */2 * * *" for every 2

permissions:
  contents: read

# One scan at a time per repo; later runs queue instead of overlapping
concurrency:
  group: semgrep-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve branch
        id: branch
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          if [ -z "$BRANCH" ]; then
            # Empty input or scheduled run: scan the branch this workflow
            # runs on — the repo's default branch unless chosen otherwise.
            BRANCH="${{ github.ref_name }}"
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: pip install --quiet semgrep

      - name: Run semgrep
        # --config auto picks rules based on the languages it detects.
        # To pin rulesets instead: --config p/ci --config p/secrets
        run: semgrep scan --config auto --json --output semgrep-results.json

      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

      - name: Report to Google Sheet
        env:
          WEBAPP_URL: ${{ secrets.SEMGREP_SHEET_URL }}
          TOKEN: ${{ secrets.SEMGREP_SHEET_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          BRANCH: ${{ steps.branch.outputs.name }}
          TRIGGER: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBAPP_URL" ] || [ -z "$TOKEN" ]; then
            echo "::error::SEMGREP_SHEET_URL / SEMGREP_SHEET_TOKEN secrets are not visible to this repo — check the org secrets' names and 'Repository access' setting, or add them as repo-level secrets."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from datetime import datetime, timezone

          with open("semgrep-results.json") as f:
              results = json.load(f).get("results", [])

          sev = Counter(
              r.get("extra", {}).get("severity", "UNKNOWN").upper() for r in results
          )
          findings = [
              {
                  "check_id": r.get("check_id", ""),
                  "severity": r.get("extra", {}).get("severity", ""),
                  "path": r.get("path", ""),
                  "start_line": (r.get("start") or {}).get("line"),
                  "end_line": (r.get("end") or {}).get("line"),
                  "message": (r.get("extra", {}).get("message") or "")[:400],
              }
              for r in results
          ]
          payload = {
              "token": os.environ["TOKEN"],
              "repo": os.environ["REPO_FULL"].split("/", 1)[1],
              "branch": os.environ["BRANCH"],
              "total": len(results),
              "error": sev.get("ERROR", 0),
              "warning": sev.get("WARNING", 0),
              "info": sev.get("INFO", 0),
              "scanned_at": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S"),
              "trigger": "scheduled" if os.environ["TRIGGER"] == "schedule" else "manual",
              "run_url": os.environ["RUN_URL"],
              "findings": findings,
          }
          with open("payload.json", "w") as f:
              json.dump(payload, f)
          print(f"Reporting {payload['total']} findings for "
                f"{payload['repo']}@{payload['branch']}")
          PY

          # -L is required: Apps Script answers with a redirect to the response.
          # Do NOT add -X POST — it would force POST on the redirect too, which
          # Google's response endpoint rejects. -d already makes this a POST.
          RESPONSE=$(curl -sSL -H "Content-Type: application/json" \
            --data-binary @payload.json "$WEBAPP_URL")
          echo "Webhook response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'
