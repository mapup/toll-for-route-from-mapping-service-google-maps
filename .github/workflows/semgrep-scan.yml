# Semgrep scan -> Google Sheet dashboard (via Apps Script webhook)
#
# Copy this file to .github/workflows/semgrep-scan.yml in each repo (on the
# default branch — the schedule trigger only fires from there).
#
# NOTE: the webhook URL and token are embedded below (no GitHub secrets
# needed). The token only allows writing rows to the dashboard — it cannot
# read anything. Keep this file out of PUBLIC repos, and to rotate the token
# (Apps Script: clear the TOKEN script property, re-run setup()) this file
# must be updated in every repo. The semgrep step excludes this file from
# its own scan so the embedded token is not reported as a finding.
#
# Repo ownership lives in the sheet's "Owners" tab — edit it there.

name: Semgrep Scan

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to scan"
        required: false
        default: "main"
  schedule:
    - cron: "0 */3 * * *" # every 3 hours (UTC); use "0 */2 * * *" for every 2

permissions:
  contents: read

# One scan at a time per repo; later runs queue instead of overlapping
concurrency:
  group: semgrep-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ github.event.inputs.branch }}"
          else
            # scheduled runs always execute on the default branch
            BRANCH="${{ github.ref_name }}"
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: pip install --quiet semgrep

      - name: Run semgrep
        # --config auto picks rules based on the languages it detects.
        # To pin rulesets instead: --config p/ci --config p/secrets
        # --exclude keeps this workflow's embedded webhook token from being
        # flagged by generic hardcoded-secret rules on every scan.
        run: >
          semgrep scan --config auto --exclude semgrep-scan.yml
          --json --output semgrep-results.json

      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

      - name: Report to Google Sheet
        env:
          WEBAPP_URL: ${{ secrets.SEMGREP_SHEET_URL }}
          TOKEN: ${{ secrets.SEMGREP_SHEET_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          BRANCH: ${{ steps.branch.outputs.name }}
          TRIGGER: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from datetime import datetime, timezone

          with open("semgrep-results.json") as f:
              results = json.load(f).get("results", [])

          sev = Counter(
              r.get("extra", {}).get("severity", "UNKNOWN").upper() for r in results
          )
          findings = [
              {
                  "check_id": r.get("check_id", ""),
                  "severity": r.get("extra", {}).get("severity", ""),
                  "path": r.get("path", ""),
                  "start_line": (r.get("start") or {}).get("line"),
                  "end_line": (r.get("end") or {}).get("line"),
                  "message": (r.get("extra", {}).get("message") or "")[:400],
              }
              for r in results
          ]
          payload = {
              "token": os.environ["TOKEN"],
              "repo": os.environ["REPO_FULL"].split("/", 1)[1],
              "branch": os.environ["BRANCH"],
              "total": len(results),
              "error": sev.get("ERROR", 0),
              "warning": sev.get("WARNING", 0),
              "info": sev.get("INFO", 0),
              "scanned_at": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S"),
              "trigger": "scheduled" if os.environ["TRIGGER"] == "schedule" else "manual",
              "run_url": os.environ["RUN_URL"],
              "findings": findings,
          }
          with open("payload.json", "w") as f:
              json.dump(payload, f)
          print(f"Reporting {payload['total']} findings for "
                f"{payload['repo']}@{payload['branch']}")
          PY

          # -L is required: Apps Script answers with a redirect to the response.
          # Do NOT add -X POST — it would force POST on the redirect too, which
          # Google's response endpoint rejects. -d already makes this a POST.
          RESPONSE=$(curl -sSL -H "Content-Type: application/json" \
            --data-binary @payload.json "$WEBAPP_URL")
          echo "Webhook response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'
